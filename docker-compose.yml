# gitmirror with Docker Compose, using the published image
# ghcr.io/axsddlr/gitmirror (amd64, arm64 and arm/v7, so it also runs on a
# Raspberry Pi). Run these in this folder:
#
#   docker compose pull
#   docker compose up -d
#   docker compose logs gitmirror      # shows the one-time web UI setup code
#
# In Dockhand or Portainer, create a stack and paste this file.
#
# Then open http://localhost:8090, enter the setup code, choose a password and
# add your sites and mirrors in the browser. No config file is needed. Everything
# you set up is kept in the gitmirror-data volume (back it up; it holds
# secret.key, which unlocks the saved tokens).
#
# The image is public; no registry login is needed. Image tags:
#   :main         newest build of the main branch
#   :sha-<commit> one exact build, to pin a version
# Update: docker compose pull && docker compose up -d (in Dockhand: redeploy
# with "pull").
#
# Build from this source code instead of pulling:
#   docker compose -f docker-compose.yml -f compose.build.yml up -d --build
#
# Settings, in a .env file next to this one or on the command line:
#   GITMIRROR_UI_PORT=8090        web pages
#   GITMIRROR_UI_BIND=127.0.0.1   where the web pages listen. 127.0.0.1 means only
#                                 this computer; 0.0.0.0 opens them to your
#                                 network. Use that only on a home network you
#                                 trust, or put an HTTPS reverse proxy (Caddy,
#                                 nginx, Traefik) in front instead.
#   GITMIRROR_WEBHOOK_PORT=8080   webhooks, /healthz, /readyz
# For example: GITMIRROR_WEBHOOK_PORT=8085 docker compose up -d
# Behind a proxy, set the "Public address" on the Webhooks page to the proxy's
# https:// URL for the webhook port.
#
# Advanced: configure with a file. Uncomment the config.yaml mount and, if you
# keep tokens in files, the secrets below:
#   mkdir -p secrets && printf '%s' "<github token>" > secrets/github_token
#   printf '%s' "<gitea token>"   > secrets/gitea_token
#   printf '%s' "<webhook secret>" > secrets/webhook_secret
#   cp config.example.yaml config.yaml    # edit: token_file entries (see below)
#
# In config.yaml refer to the secrets by path instead of embedding tokens:
#   forges:
#     github: { type: github, token_file: /run/secrets/github_token }
#     gitea:  { type: gitea, url: "https://git.example.com", token_file: /run/secrets/gitea_token }
#   server:
#     webhook_secret_file: /run/secrets/webhook_secret
#
# Secret files must be readable by uid 10001 (the container user): chmod 0444, or
# chown 10001 on the host. The image runs as non-root uid/gid 10001.
services:
  gitmirror:
    image: ghcr.io/axsddlr/gitmirror:main
    restart: unless-stopped
    command: ["serve"]
    environment:
      GITMIRROR_STATE_DIR: /data     # also set in the image; overrides state_dir in config.yaml
      GITMIRROR_UI_LISTEN: ":8090"   # also set in the image; overrides server.ui_listen
    ports:
      - "${GITMIRROR_WEBHOOK_PORT:-8080}:8080"                              # webhooks
      - "${GITMIRROR_UI_BIND:-127.0.0.1}:${GITMIRROR_UI_PORT:-8090}:8090"   # web UI
      # Do NOT publish 9090: /metrics is unauthenticated. Set `server.metrics_listen: ":9090"`
      # in config.yaml and scrape it from another container on the same Docker network.
    volumes:
      - gitmirror-data:/data
      # Advanced: an optional config file. The image reads /config/config.yaml when
      # it exists and uses built-in defaults when it does not.
      # - ./config.yaml:/config/config.yaml:ro
    # Advanced: token and webhook secret files for config.yaml (see the top of this file).
    # secrets:
    #   - github_token
    #   - gitea_token
    #   - webhook_secret
    # serve lets running syncs finish for up to 10 minutes after SIGTERM; give it more
    # than Docker's default 10 s stop timeout so a restart does not abort a sync.
    stop_grace_period: 11m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Optional: a throw-away Gitea to try gitmirror against. Uncomment it and the
  # gitea-data volume, run `docker compose up -d`, create a user and a token at
  # http://localhost:3000, then add a Gitea site at http://gitea:3000 in gitmirror.
  # For webhooks, set the Public address on gitmirror's Webhooks page to
  # http://gitmirror:8080.
  # gitea:
  #   image: gitea/gitea:28.3.0
  #   restart: unless-stopped
  #   environment:
  #     GITEA__security__INSTALL_LOCK: "true"
  #     GITEA__server__ROOT_URL: http://localhost:3000/
  #     GITEA__webhook__ALLOWED_HOST_LIST: private   # let Gitea call gitmirror on the Docker network
  #   ports:
  #     - "127.0.0.1:3000:3000"
  #   volumes:
  #     - gitea-data:/data

# Advanced: uncomment together with the service's secrets list.
# secrets:
#   github_token:
#     file: ./secrets/github_token
#   gitea_token:
#     file: ./secrets/gitea_token
#   webhook_secret:
#     file: ./secrets/webhook_secret

volumes:
  gitmirror-data:
  # gitea-data:
