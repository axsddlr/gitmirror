{{define "content"}}
<div class="narrow">
<h1>Sign in</h1>
<section class="card">
  <form method="post" action="/login{{if .Data}}?next={{.Data}}{{end}}">
    {{template "csrf" .}}
    {{template "formerror" .Form}}
    {{template "field" (field .Form "password" "Password" "password" "current-password")}}
    <button class="btn btn-primary" type="submit">Sign in</button>
  </form>
</section>
</div>
{{end}}
