{{define "content"}}
<div class="narrow-wide">
<h1>{{.Title}}</h1>
<section class="card{{if .Data.Action}} danger-zone{{end}}">
  {{- range .Data.Lines}}<p>{{.}}</p>{{end}}
  {{- if .Data.Items}}<ul>{{range .Data.Items}}<li>{{.}}</li>{{end}}</ul>{{end}}
  <div class="actions">
  {{- if .Data.Action}}
    <form method="post" action="{{.Data.Action}}">
      {{template "csrf" .}}
      <button class="btn btn-danger" type="submit">{{.Data.Button}}</button>
    </form>
    <a class="btn" href="{{.Data.Back}}">Cancel</a>
  {{- else}}
    <a class="btn" href="{{.Data.Back}}">Back</a>
  {{- end}}
  </div>
</section>
</div>
{{end}}
